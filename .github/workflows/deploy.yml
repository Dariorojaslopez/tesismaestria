name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-self-hosted:
    if: vars.USE_SELF_HOSTED_RUNNER == 'true'
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: bash ~/tesismaestria/scripts/deploy.sh

  deploy-ssh:
    if: vars.USE_SELF_HOSTED_RUNNER != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 45m
          script: |
            bash ~/tesismaestria/scripts/deploy.sh
