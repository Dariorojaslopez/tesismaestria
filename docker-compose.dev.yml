services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ellas
      POSTGRES_PASSWORD: ellas
      POSTGRES_DB: chatbot_capilar
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ellas -d chatbot_capilar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_dev:
